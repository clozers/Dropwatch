name: dropwatch
description: Pendamping toko harian VALORANT berbasis screenshot dan katalog publik.
publish_to: none
version: 1.1.0+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/hub_aliases.json
    - assets/catalog.json
    - assets/bundled.json
    - assets/art/
    - assets/fonts/OFL.txt
  fonts:
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
